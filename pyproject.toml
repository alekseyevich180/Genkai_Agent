[project]
name = "Genkai"
# "+sage" marks builds from the SAGE branch (modeling only); manifest.json records this version.
version = "2.2.0+sage"
description = "SAGE: automated atomistic surface modeling for gas-sensor research (modeling branch of Genkai)."
readme = "README.md"
# Verified locally on 3.11 and in CI on 3.12.
requires-python = ">=3.11"
# Lower bounds are the versions the modeling tests were verified with.
dependencies = [
    "ase>=3.26.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "optuna>=4.5.0",
    "pandas>=2.3.0",
    "pydantic>=2.11.0",
    "pymatgen>=2025.6.14",
    "pyyaml>=6.0",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
# UMA through FAIRChem for the MLIP screening layer; brings in torch.
mlip = ["fairchem-core>=2.7.1"]
# Downloading bulk crystals from Materials Project (needs network and MP_API_KEY).
materials-project = ["mp-api>=0.46.0"]
test = ["pytest>=8.0"]

[project.scripts]
genkai-surface = "genkai.modeling.surface.jobs:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["genkai*"]

[tool.setuptools.package-data]
"genkai.modeling" = [
    "schema/*.json",
]

[tool.pytest.ini_options]
markers = [
    "unit: isolated deterministic test",
    "contract: artifact or API contract test",
    "integration: offline multi-component test",
    "compatibility: legacy entrypoint compatibility test",
    "external: requires external runtime or network and is opt-in",
]
addopts = "-m 'not external'"
