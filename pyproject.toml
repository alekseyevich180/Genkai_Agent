[project]
name = "Genkai"
version = "2.2.0"
description = "A multi-agent framework for complex computational material tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.29.0",
    "matplotlib>=3.11.0",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "fastmcp>=3.4.2",
    "google-adk>=2.3.0",
    "google-cloud-storage>=3.12.0",
    "lbg>=1.2.29",
    "litellm>=1.89.4",
    "periodictable>=2.1.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "networkx>=3.6.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "py3dmol>=2.5.5",
    "a2a-sdk==0.3.25",
    "tavily-cli>=0.1.4",
    "pymatgen-analysis-diffusion>=2025.11.15",
    "mp-api>=0.46.4",
    "bcrypt>=5.0.0",
    "matcraft-kit>=0.1.5",
    "know-do-graph>=0.1.8"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
agent = "agent.init.start_agent:main"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_pypi = false
upload_to_release = true
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
