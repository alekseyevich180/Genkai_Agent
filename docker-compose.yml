services:
  agent:
    build: .
    image: agent:latest
    container_name: agent
    ports:
      - "8000:8000"
      - "8001:8001"
      - "5173:5173"
    volumes:
      - ./agents/Agent/.workspace:/app/agents/Agent/.workspace
      - ./agents/Agent/.adk:/app/agents/Agent/.adk
      - ./logs:/app/logs
    env_file:
      - agents/Agent/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
